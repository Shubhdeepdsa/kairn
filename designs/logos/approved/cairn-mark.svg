<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Direction A Canonical Mark with Wayfinding Micro-Geometry -->
  <rect width="120" height="120" rx="16" fill="#F4F6F7"/>
  <g transform="translate(20, 26)">
    <!-- Top Capstone (Mineral Yellow #E4D13A) with Black/Graphite Centroid Dot -->
    <rect x="26" y="0" width="28" height="14" rx="4" fill="#E4D13A"/>
    <circle cx="40" cy="7" r="2.2" fill="#20282E"/>
    
    <!-- Middle Tier (Precision Graphite #20282E) with Precision Negative Slit / Line in the Middle -->
    <rect x="14" y="20" width="52" height="16" rx="5" fill="#20282E"/>
    <line x1="28" y1="28" x2="52" y2="28" stroke="#F4F6F7" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Base Foundation (Precision Graphite #20282E) with Mineral Yellow Dash on the Left -->
    <rect x="0" y="42" width="80" height="20" rx="6" fill="#20282E"/>
    <rect x="6" y="50" width="14" height="4" rx="2" fill="#E4D13A"/>
  </g>
</svg>
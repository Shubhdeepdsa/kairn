<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Direction A: Full Horizontal Lockup with Authentic Wayfinding Micro-Geometry -->
  <g transform="translate(10, 14)">
    <!-- Symbol with Dot, Line, and Dash -->
    <!-- Top Tier: Mineral Yellow with dark centroid dot -->
    <rect x="16" y="0" width="18" height="9" rx="2.5" fill="#E4D13A"/>
    <circle cx="25" cy="4.5" r="1.4" fill="#20282E"/>
    
    <!-- Middle Tier: Graphite with center slit line -->
    <rect x="8" y="14" width="34" height="11" rx="3" fill="#20282E"/>
    <line x1="17" y1="19.5" x2="33" y2="19.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round"/>
    
    <!-- Base Tier: Graphite with Mineral Yellow dash on the left -->
    <rect x="0" y="30" width="50" height="14" rx="4" fill="#20282E"/>
    <rect x="4" y="35" width="9" height="3" rx="1.5" fill="#E4D13A"/>
    
    <!-- Wordmark text in Syne bold -->
    <text x="68" y="37" font-family="'Syne', sans-serif" font-size="34" font-weight="700" fill="#20282E" letter-spacing="-0.03em">kairn</text>
    <!-- Mineral Punctuation Dot -->
    <circle cx="158" cy="34" r="4.5" fill="#E4D13A"/>
  </g>
</svg>
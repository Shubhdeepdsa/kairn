<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Direction A: The Abstract Cairn Mark (Primary Colorway: Graphite + Mineral Capstone) -->
  <rect width="120" height="120" rx="16" fill="#F4F6F7"/>
  <g transform="translate(20, 26)">
    <!-- Top Capstone (Mineral Yellow #E4D13A) -->
    <rect x="26" y="0" width="28" height="14" rx="4" fill="#E4D13A"/>
    <!-- Middle Tier (Precision Graphite #20282E) -->
    <rect x="14" y="20" width="52" height="16" rx="5" fill="#20282E"/>
    <!-- Base Foundation (Precision Graphite #20282E) -->
    <rect x="0" y="42" width="80" height="20" rx="6" fill="#20282E"/>
  </g>
</svg>